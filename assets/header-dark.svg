<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Shruti Shankar Narayanan. I build what I design. Product designer who codes.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    @keyframes draw { from { stroke-dashoffset: 940; } }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes nudge { from { opacity: 0; transform: translate(70px, 50px); } }
    /* fill-mode backwards: if a renderer skips animation, everything still shows */
    .box { stroke-dasharray: 940; animation: draw 1.1s cubic-bezier(.2,.7,.2,1) .4s backwards; }
    .wash { animation: pop .6s ease-out 1s backwards; }
    .handles, .tag { animation: pop .4s ease-out 1.3s backwards; }
    .cursor { animation: nudge 1s cubic-bezier(.2,.7,.2,1) .1s backwards; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 50% { transform: scale(.45) rotate(45deg); opacity: .5; } }
    @keyframes bob { 50% { transform: translate(-5px, -4px); } }
    @keyframes scribble { from { stroke-dashoffset: 700; } }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    .cursor { animation: nudge 1s cubic-bezier(.2,.7,.2,1) .1s backwards, bob 3.2s ease-in-out 1.2s infinite; }
    .arrow { stroke-dasharray: 700; animation: scribble 1.2s ease-out 1.7s backwards; }
    .note { animation: pop .5s ease-out 2.4s backwards; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="470" rx="20" fill="#0E0F13"/>
  
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2A2A2E"/>
    </pattern>
    <radialGradient id="g" cx="78%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="470" fill="url(#g)"/></mask>
  </defs>
  <rect width="1200" height="470" fill="url(#dots)" mask="url(#fade)"/>

  <text x="72" y="84" class="mono" font-size="17" letter-spacing="3" fill="#8C8A84">SHRUTI SHANKAR NARAYANAN</text>
  <line x1="72" y1="106" x2="152" y2="106" stroke="#F2F1EC" stroke-width="2"/>

  <text x="64" y="204" class="sans" font-size="120" font-weight="600" letter-spacing="-5" fill="#F2F1EC">I build what</text>
  <text x="64" y="318" class="sans" font-size="120" font-weight="600" fill="#F2F1EC">I</text>
  <rect class="wash" x="106" y="226" width="342" height="116" fill="#8EC16A" fill-opacity="0.2"/>
  <text x="116" y="318" class="sans" font-size="120" font-weight="600" textLength="322" lengthAdjust="spacingAndGlyphs" fill="#8EC16A">design</text>
  <text x="456" y="318" class="sans" font-size="120" font-weight="600" fill="#F2F1EC">.</text>

  <rect class="box" x="106" y="226" width="342" height="116" fill="none" stroke="#8EC16A" stroke-width="2"/>
  <g class="handles"><rect x="100" y="220" width="12" height="12" fill="#0E0F13" stroke="#8EC16A" stroke-width="2"/><rect x="442" y="220" width="12" height="12" fill="#0E0F13" stroke="#8EC16A" stroke-width="2"/><rect x="100" y="336" width="12" height="12" fill="#0E0F13" stroke="#8EC16A" stroke-width="2"/><rect x="442" y="336" width="12" height="12" fill="#0E0F13" stroke="#8EC16A" stroke-width="2"/></g>
  <g class="tag">
    <rect x="225.0" y="356" width="104" height="26" rx="4" fill="#8EC16A"/>
    <text x="277.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#0E0F13">342 × 116</text>
  </g>
  <path class="twinkle" style="animation-delay:0s" d="M668 104 Q671.92 114.08 682 118 Q671.92 121.92 668 132 Q664.08 121.92 654 118 Q664.08 114.08 668 104Z" fill="#8EC16A"/>
  <path class="twinkle" style="animation-delay:0.9s" d="M492 215 Q493.96 220.04 499 222 Q493.96 223.96 492 229 Q490.04 223.96 485 222 Q490.04 220.04 492 215Z" fill="#F2F1EC"/>
  <path class="twinkle" style="animation-delay:1.6s" d="M84 355 Q86.52 361.48 93 364 Q86.52 366.52 84 373 Q81.48 366.52 75 364 Q81.48 361.48 84 355Z" fill="#8EC16A"/>

  <!-- A margin note, as if scribbled on the canvas -->
  <path class="arrow" d="M 800 232 C 780 300, 700 318, 676 280 C 656 248, 708 236, 712 272 C 716 312, 620 316, 520 268" fill="none" stroke="#8C8A84" stroke-width="2.5" stroke-linecap="round"/>
  <path class="arrow" d="M 534 290 L 516 266 L 544 258" fill="none" stroke="#8C8A84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="note" x="790" y="214" font-family="'Bradley Hand', Noteworthy, 'Segoe Print', 'Ink Free', 'Comic Sans MS', cursive" font-size="34" fill="#8EC16A" transform="rotate(-5 790 214)">the fun part!</text>

  <g class="cursor">
    <path d="M 504 336 l 0 34 l 9 -9 l 7 15 l 7 -3 l -7 -15 l 13 0 z" fill="#F2F1EC" stroke="#0E0F13" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <text x="72" y="418" class="mono" font-size="18" fill="#8C8A84">Product designer who codes<tspan class="caret" fill="#8EC16A"> ▍</tspan></text>
  <text x="1128" y="418" text-anchor="end" class="mono" font-size="18" fill="#8C8A84">shrutishankarnarayanan.com ↗</text>
</svg>
