<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Shruti Shankar Narayanan. I build what I design. Product designer who codes.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    @keyframes draw { from { stroke-dashoffset: 940; } }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes nudge { from { opacity: 0; transform: translate(70px, 50px); } }
    /* fill-mode backwards: if a renderer skips animation, everything still shows */
    .box { stroke-dasharray: 940; animation: draw 1.1s cubic-bezier(.2,.7,.2,1) .4s backwards; }
    .handles, .tag { animation: pop .4s ease-out 1.3s backwards; }
    .cursor { animation: nudge 1s cubic-bezier(.2,.7,.2,1) .1s backwards; }
    .caret { animation: blink 1.1s steps(1) infinite; }
  </style>
  <rect width="1200" height="470" rx="20" fill="#0E0E10"/>
  
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2A2A2E"/>
    </pattern>
    <radialGradient id="g" cx="78%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="470" fill="url(#g)"/></mask>
  </defs>
  <rect width="1200" height="470" fill="url(#dots)" mask="url(#fade)"/>

  <text x="72" y="84" class="mono" font-size="17" letter-spacing="3" fill="#8C8A84">SHRUTI SHANKAR NARAYANAN</text>
  <line x1="72" y1="106" x2="152" y2="106" stroke="#F2F1EC" stroke-width="2"/>

  <text x="64" y="204" class="sans" font-size="120" font-weight="600" letter-spacing="-5" fill="#F2F1EC">I build what</text>
  <text x="64" y="318" class="sans" font-size="120" font-weight="600" fill="#F2F1EC">I</text>
  <text x="116" y="318" class="sans" font-size="120" font-weight="600" textLength="322" lengthAdjust="spacingAndGlyphs" fill="#7C8CFF">design</text>
  <text x="456" y="318" class="sans" font-size="120" font-weight="600" fill="#F2F1EC">.</text>

  <rect class="box" x="106" y="226" width="342" height="116" fill="none" stroke="#7C8CFF" stroke-width="2"/>
  <g class="handles"><rect x="100" y="220" width="12" height="12" fill="#0E0E10" stroke="#7C8CFF" stroke-width="2"/><rect x="442" y="220" width="12" height="12" fill="#0E0E10" stroke="#7C8CFF" stroke-width="2"/><rect x="100" y="336" width="12" height="12" fill="#0E0E10" stroke="#7C8CFF" stroke-width="2"/><rect x="442" y="336" width="12" height="12" fill="#0E0E10" stroke="#7C8CFF" stroke-width="2"/></g>
  <g class="tag">
    <rect x="225.0" y="356" width="104" height="26" rx="4" fill="#7C8CFF"/>
    <text x="277.0" y="374" text-anchor="middle" class="mono" font-size="13" fill="#0E0E10">342 × 116</text>
  </g>
  <g class="cursor">
    <path d="M 504 336 l 0 34 l 9 -9 l 7 15 l 7 -3 l -7 -15 l 13 0 z" fill="#F2F1EC" stroke="#0E0E10" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <text x="72" y="418" class="mono" font-size="18" fill="#8C8A84">Product designer who codes<tspan class="caret" fill="#7C8CFF"> ▍</tspan></text>
  <text x="1128" y="418" text-anchor="end" class="mono" font-size="18" fill="#8C8A84">shrutishankarnarayanan.com ↗</text>
</svg>
