<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-label="Sush: A desktop AI agent your team can run together, live and end-to-end encrypted">
  <style>
    .beat, .ping, .wave, .press { transform-box: fill-box; transform-origin: center; }
    @keyframes beat { 0%, 40%, 100% { transform: scale(1); } 10%, 28% { transform: scale(1.12); } }
    @keyframes ping { to { transform: scale(2.8); opacity: 0; } }
    @keyframes wave { 50% { transform: translateY(-7px); } }
    @keyframes press { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(.88); } }
    .beat { animation: beat 2.4s ease-in-out infinite; }
    .ping { animation: ping 1.8s ease-out infinite; }
    .wave { animation: wave 2.2s ease-in-out infinite; }
    .press { animation: press 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="1198" height="166" rx="18" fill="#0E0F13" stroke="#1F1F23" stroke-width="2"/>
  <text x="40" y="62" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#8C8A84">01</text>
  <text x="104" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#F2F1EC">Sush</text>
  <text x="104" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8C8A84">A desktop AI agent your team can run together, live and end-to-end encrypted</text>
  <text x="104" y="140" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#8EC16A">sush-website-ten.vercel.app  ↗</text>
  <g transform="translate(1016 24)"><rect x="8" y="18" width="104" height="84" rx="14" fill="none" stroke="#2A2A2E" stroke-width="2"/>
    <circle cx="48" cy="62" r="20" fill="#8EC16A"/>
    <circle cx="74" cy="62" r="20" fill="#F2F1EC" stroke="#0E0F13" stroke-width="4"/>
    <text x="48" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0E0F13">S</text>
    <text x="74" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0E0F13">S</text>
    <circle class="ping" cx="96" cy="32" r="5" fill="none" stroke="#8EC16A" stroke-width="2"/>
    <circle cx="96" cy="32" r="5" fill="#8EC16A"/></g>
</svg>
